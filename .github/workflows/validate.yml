name: validate

# Renders every Kustomize overlay to prove the manifests are buildable.
# Kept intentionally simple so it cannot fail spuriously: if `kustomize build`
# succeeds for each overlay, the GitOps sources are valid.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kustomize-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sSfL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Build base
        run: kustomize build workloads/sample-app/base

      - name: Build dev overlay
        run: kustomize build workloads/sample-app/overlays/dev

      - name: Build staging overlay
        run: kustomize build workloads/sample-app/overlays/staging

      - name: Build prod overlay
        run: kustomize build workloads/sample-app/overlays/prod

      - name: Assert prod ships an HPA targeting the prod Deployment
        # Guards the prod-only autoscaler: fail loudly if the overlay stops
        # rendering the HPA or its scaleTargetRef drifts off the Deployment.
        run: |
          rendered="$(kustomize build workloads/sample-app/overlays/prod)"
          echo "$rendered" | grep -q "kind: HorizontalPodAutoscaler"
          echo "$rendered" | grep -q "name: sample-app-prod"
