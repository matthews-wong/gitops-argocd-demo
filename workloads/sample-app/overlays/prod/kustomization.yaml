apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prod overlay: deploys the sample app into the sample-app-prod namespace
# with three replicas, larger resources, and a pinned image tag.
namespace: sample-app-prod

resources:
  - ../../base
  # Prod-only: autoscale the web tier on CPU (dev/staging stay fixed-size).
  - hpa.yaml

nameSuffix: -prod

commonLabels:
  app.kubernetes.io/instance: sample-app-prod
  environment: prod

patches:
  - path: patch-deployment.yaml

images:
  - name: nginxdemos/hello
    # Pin an immutable tag in prod rather than tracking `latest`.
    newTag: plain-text
