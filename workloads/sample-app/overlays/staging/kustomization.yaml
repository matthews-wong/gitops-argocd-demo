apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging overlay: a pre-production environment that sits between dev and prod.
# It runs two replicas with mid-sized resources and pins the same immutable
# image tag prod will promote, so a release candidate is validated here first.
namespace: sample-app-staging

resources:
  - ../../base

nameSuffix: -staging

commonLabels:
  app.kubernetes.io/instance: sample-app-staging
  environment: staging

patches:
  - path: patch-deployment.yaml

images:
  - name: nginxdemos/hello
    # Pin the release candidate tag; prod promotes the same immutable tag.
    newTag: plain-text
